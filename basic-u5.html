<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic U5 – LiveABC Vocab Quiz</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3b5984;
            --secondary: #f4f7f6;
            --text: #2c3e50;
            --success: #2ec4b6;
            --danger: #e71d36;
            --border: #dcdde1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fafbfc; color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--secondary); padding-bottom: 15px; margin-bottom: 25px; }
        .badge { background: #e8f0fe; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: 6px; font-size: 0.9rem; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
        .setup-screen, .quiz-screen, .result-screen { display: none; }
        .active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.2s; width: 100%; font-weight: 600; }
        .btn:hover { background: var(--primary-hover); }
        .progress-bar { height: 6px; background: var(--secondary); border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-inner { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .question-box { margin-bottom: 25px; }
        .sentence-cn { color: #7f8c8d; font-size: 1.05rem; margin-bottom: 12px; line-height: 1.5; }
        .sentence-en { font-size: 1.25rem; line-height: 1.6; word-spacing: 2px; margin-bottom: 20px; font-weight: 500; }
        .clickable-word { cursor: pointer; border-bottom: 1px dashed #bdc3c7; transition: color 0.1s; display: inline-block; }
        .clickable-word:hover { color: var(--primary); background: #f0f3f7; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .option-card { background: white; border: 2px solid var(--border); border-radius: 8px; padding: 15px; cursor: pointer; font-size: 1.1rem; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .option-card:hover { border-color: var(--primary); background: #fdfdfd; }
        .option-card.correct { border-color: var(--success); background: #e6f9f7; color: #0f5132; }
        .option-card.wrong { border-color: var(--danger); background: #fde8e9; color: #842029; }
        .feedback { font-size: 1.1rem; margin-top: 15px; font-weight: 600; display: none; padding: 12px; border-radius: 6px; }
        .feedback.correct { background: #e6f9f7; color: var(--success); display: block; }
        .feedback.wrong { background: #fde8e9; color: var(--danger); display: block; }
        .def-box { margin-top: 10px; font-size: 0.95rem; font-weight: normal; color: #555; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 8px; }
        .result-screen text-align: center;
        .score-display { font-size: 3rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .dict-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .dict-content { background: white; padding: 25px; border-radius: 10px; max-width: 500px; width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.15); position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #95a5a6; }
        .dict-title { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .dict-body { font-size: 1rem; line-height: 1.5; color: var(--text); }
        .tts-icon { cursor: pointer; color: var(--primary); display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; vertical-align: middle; margin-left: 5px; }
        .tts-icon svg { width: 20px; height: 20px; }
        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Basic U5 · Vocab Quiz</h1>
        <div class="badge">Basic U5 · LiveABC</div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="setup-screen active">
        <div class="form-group">
            <label for="student-name">學生姓名 (Student Name):</label>
            <input type="text" id="student-name" placeholder="請輸入您的英文或中文姓名" autocomplete="off">
        </div>
        <button class="btn" onclick="startQuiz()">開始測驗 (Start Quiz)</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="quiz-screen">
        <div class="progress-bar">
            <div id="progress-inner" class="progress-inner"></div>
        </div>
        <div class="question-box">
            <div id="sentence-cn" class="sentence-cn"></div>
            <div id="sentence-en" class="sentence-en"></div>
        </div>
        <div id="options-grid" class="options-grid"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="btn" style="display:none; margin-top:15px;" onclick="nextQuestion()">下一題 (Next)</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="result-screen" style="text-align: center;">
        <h2>測驗完成！</h2>
        <div class="score-display"><span id="score-num">0</span>%</div>
        <p id="result-meta" style="color:#7f8c8d;"></p>
        <button class="btn" onclick="location.reload()">重新挑戰 (Retry)</button>
    </div>
</div>

<!-- ONLINE DICTIONARY MODAL -->
<div id="dict-modal" class="dict-modal" onclick="closeDict(event)">
    <div class="dict-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="document.getElementById('dict-modal').style.display='none'">&times;</span>
        <div class="dict-title">
            <span id="dict-word">Word</span>
            <span class="tts-icon" onclick="playDictTTS()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
        </div>
        <div id="dict-body" class="dict-body">查詢中...</div>
    </div>
</div>

// 2. STATE APP VARIABLES
let studentName = "";
let currentIdx = 0;
let score = 0;
let wrongWords = [];
let lookedUpWords = [];
let shuffledQuiz = [];
let activeTargetWord = "";

// Shuffle helper
function shuffleArray(arr) {
    return arr.sort(() => Math.random() - 0.5);
}

// Start Quiz Session
function startQuiz() {
    const nameInput = document.getElementById("student-name").value.trim();
    if (!nameInput) {
        alert("請輸入學生姓名以開始測驗！");
        return;
    }
    studentName = nameInput;
    document.getElementById("setup-screen").classList.remove("active");
    document.getElementById("quiz-screen").classList.add("active");
    
    // Shuffle entire dataset for full coverage testing
    shuffledQuiz = [...DATA];
    shuffleArray(shuffledQuiz);
    
    currentIdx = 0;
    score = 0;
    wrongWords = [];
    lookedUpWords = [];
    
    showQuestion();
}

// Render Question View
function showQuestion() {
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("feedback").className = "feedback";
    
    const progressPercent = (currentIdx / shuffledQuiz.length) * 100;
    document.getElementById("progress-inner").style.width = progressPercent + "%";
    
    const item = shuffledQuiz[currentIdx];
    document.getElementById("sentence-cn").textContent = item.text_cn;
    
    // Transform English sentence to include live click-to-lookup tokens
    const enContainer = document.getElementById("sentence-en");
    enContainer.innerHTML = "";
    
    // Build tokenized text layout safely supporting blanks
    const parts = item.text_en.split(" ");
    parts.forEach(part => {
        if(part.includes("_______")) {
            const spanBlank = document.createElement("span");
            spanBlank.style.borderBottom = "2px solid var(--text)";
            spanBlank.style.padding = "0 15px";
            spanBlank.style.fontWeight = "bold";
            spanBlank.style.color = "var(--primary)";
            spanBlank.id = "blank-word-anchor";
            spanBlank.innerHTML = "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
            enContainer.appendChild(spanBlank);
            enContainer.appendChild(document.createTextNode(" "));
        } else {
            const cleanToken = part.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g,"");
            const wordSpan = document.createElement("span");
            wordSpan.className = "clickable-word";
            wordSpan.textContent = part;
            wordSpan.onclick = () => openDict(cleanToken);
            enContainer.appendChild(wordSpan);
            enContainer.appendChild(document.createTextNode(" "));
        }
    });
    
    // Generate Distractors following the strict same-category filtering rule
    generateOptions(item);
}

// Build 4 Multiple Choice Buttons with Advanced Distractor Protection
function generateOptions(currentItem) {
    const optionsGrid = document.getElementById("options-grid");
    optionsGrid.innerHTML = "";
    
    // Filter distractors avoiding any direct or reciprocal bidirectional synonyms
    let pool = DATA.filter(x => {
        if (x.word === currentItem.word) return false;
        // Block explicitly defined local synonyms grouping
        if (currentItem.synonyms && currentItem.synonyms.includes(x.word)) return false;
        if (x.synonyms && x.synonyms.includes(currentItem.word)) return false;
        return true;
    });
    
    // Tier 1: Try gathering options with identical Parts Of Speech (POS)
    let samePosPool = pool.filter(x => x.pos === currentItem.pos);
    if (samePosPool.length < 3) {
        samePosPool = pool; // Fallback to general pool if parts of speech are scarce
    }
    
    shuffleArray(samePosPool);
    let options = [currentItem];
    for(let i=0; i<samePosPool.length; i++) {
        if(options.length >= 4) break;
        if(!options.some(opt => opt.word === samePosPool[i].word)) {
            options.push(samePosPool[i]);
        }
    }
    
    // Final defensive shuffle ensuring correct option doesn't stay stuck at first position
    shuffleArray(options);
    
    options.forEach(opt => {
        const card = document.createElement("div");
        card.className = "option-card";
        card.innerHTML = `<span><b>${opt.word}</b> <small style="color:#7f8c8d;">${opt.pos}</small></span>`;
        card.onclick = () => checkAnswer(card, opt.word, currentItem.word);
        optionsGrid.appendChild(card);
    });
}

// Handle Multiple Choice Click Selection
function checkAnswer(selectedCard, chosenWord, correctWord) {
    // Prevent duplicated submissions on clicked elements
    const cards = document.querySelectorAll(".option-card");
    cards.forEach(c => c.onclick = null);
    
    const feedback = document.getElementById("feedback");
    const currentItem = shuffledQuiz[currentIdx];
    
    // Reveal correct item onto the display blank placeholder
    const blankAnchor = document.getElementById("blank-word-anchor");
    if(blankAnchor) {
        blankAnchor.textContent = correctWord;
    }
    
    if (chosenWord === correctWord) {
        score++;
        selectedCard.classList.add("correct");
        feedback.className = "feedback correct";
        feedback.innerHTML = `✓ 正確！<div class="def-box"><b>${currentItem.word}</b> (${currentItem.pos}): ${currentItem.def_en}<br>解說：${currentItem.def_cn}</div>`;
    } else {
        selectedCard.classList.add("wrong");
        feedback.className = "feedback wrong";
        feedback.innerHTML = `✗ 錯誤！正確答案應為 <b>${correctWord}</b>。<div class="def-box"><b>${currentItem.word}</b> (${currentItem.pos}): ${currentItem.def_en}<br>解說：${currentItem.def_cn}</div>`;
        if(!wrongWords.includes(correctWord)) {
            wrongWords.push(correctWord);
        }
        
        // Visual indicator enhancement highlighting exact correct target card
        cards.forEach(c => {
            if(c.textContent.trim().startsWith(correctWord)) {
                c.classList.add("correct");
            }
        });
    }
    
    // Play Web Audio Text-To-Speech Synthesis instantly for sentence immersive comprehension
    playTTS(currentItem.text_en.replace("_______", correctWord));
    
    document.getElementById("next-btn").style.display = "block";
}

// Move to next card or submit scoring
function nextQuestion() {
    currentIdx++;
    if(currentIdx < shuffledQuiz.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

// Finish Exam and trigger submission pipelines
function finishQuiz() {
    document.getElementById("quiz-screen").classList.remove("active");
    document.getElementById("result-screen").classList.add("active");
    
    const percent = Math.round((score / shuffledQuiz.length) * 100);
    document.getElementById("score-num").textContent = percent;
    document.getElementById("result-meta").innerHTML = `學生：${studentName}<br>答對題數：${score} / ${shuffledQuiz.length}`;
    
    // Push logs remotely to Google Sheets Spreadsheet backend via Apps Script CORS API
    const payload = {
        timestamp: new Date().toISOString(),
        studentName: studentName,
        scorePercent: percent,
        wrongWords: wrongWords.join(", ") || "無",
        lookedUpWords: lookedUpWords.join(", ") || "無"
    };
    
    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).catch(err => console.log("Logging framework metrics offline saved.", err));
}

// Immersive Web Audio Speech Synth Api Wrapper
function playTTS(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }
}

// Dictionary Modal Open Trigger
function openDict(word) {
    if(!word) return;
    activeTargetWord = word;
    document.getElementById("dict-word").textContent = word;
    document.getElementById("dict-body").textContent = "查詢中...";
    document.getElementById("dict-modal").style.display = "flex";
    
    if(!lookedUpWords.includes(word)) {
        lookedUpWords.push(word);
    }
    
    // Dynamic Cloud Dictionary fetch directly to free translation proxy engine
    const api = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-TW`;
    fetch(api)
        .then(res => res.json())
        .then(data => {
            if(data && data.responseData) {
                document.getElementById("dict-body").innerHTML = `
                    <p style="font-size:1.15rem; color:#2c3e50; margin-bottom:5px;"><b>翻譯結果：</b></p>
                    <p style="font-size:1.3rem; color:#e67e22; font-weight:bold;">${data.responseData.translatedText}</p>
                    <small style="color:#95a5a6; display:block; margin-top:15px; border-top:1px solid #eee; padding-top:5px;">* 線上字典提供即時外部翻譯參考</small>
                `;
            }
        })
        .catch(() => {
            document.getElementById("dict-body").textContent = "無法取得即時網路連線翻譯。";
        });
}

function closeDict(e) {
    if(e.target.id === "dict-modal") {
        document.getElementById("dict-modal").style.display = "none";
    }
}

function playDictTTS() {
    if(activeTargetWord) {
        playTTS(activeTargetWord);
    }
}
</script>
